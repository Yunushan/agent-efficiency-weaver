[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-efficiency-weaver"
version = "0.1.0"
description = "Portable AI agent MCP profiles, skills and reproducible efficiency evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.16.2",
    "mypy==2.3.1",
    "build==1.5.0",
    "setuptools==84.0.0",
    "wheel==0.47.0",
    "PyYAML==6.0.3",
]

[project.scripts]
agentweaver = "agentweaver.cli:main"

[tool.setuptools]
packages = ["agentweaver"]
package-dir = {"" = ".", "agentweaver" = "src/agentweaver"}

[tool.setuptools.package-data]
agentweaver = ["py.typed"]

[tool.setuptools.cmdclass]
build_py = "build_helpers.DataBuildPy"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
